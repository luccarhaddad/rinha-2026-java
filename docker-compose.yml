# Submission topology: nginx LB on :9999 round-robin across 2 API instances.
# 2 × 0.45 CPU + 0.10 nginx = 1.0 CPU; 2 × 140 MB + 30 MB nginx = 310 MB
# (FAISS mmap is 66 MB per instance — 3 instances doesn't fit the 350 MB budget).
services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api-1: &api
    image: luccarhaddad/rinha2026-java:faiss-v2
    environment:
      PORT: "8080"
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"

  api-2:
    <<: *api

networks:
  app:
    driver: bridge
