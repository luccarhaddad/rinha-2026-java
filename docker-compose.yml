# Submission topology: nginx LB on :9999, talks to 2 API instances via Unix Domain Sockets.
# 2 × 0.45 CPU + 0.10 nginx = 1.0 CPU; 2 × 160 MB + 30 MB nginx = 350 MB (full budget).
# UDS sockets live on a shared named volume `sockets` mounted at /sock in all 3 containers.
services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sock
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api-1: &api
    image: luccarhaddad/rinha2026-java:faiss-v6
    environment:
      SOCK_PATH: /sock/api-1.sock
    volumes:
      - sockets:/sock
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api-2:
    <<: *api
    environment:
      SOCK_PATH: /sock/api-2.sock

networks:
  app:
    driver: bridge

volumes:
  sockets:
