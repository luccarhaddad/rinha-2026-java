# Replace YOUR_REGISTRY_USER with your public registry namespace before publishing.
# `mvn jib:dockerBuild` builds this image name into the local Docker daemon (no push needed for local runs).
services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api-1: &api
    image: luccarhaddad/rinha2026-java:faiss-v1
    environment:
      PORT: "8080"
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api-2:
    <<: *api

networks:
  app:
    driver: bridge