worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    # Tighter, latency-friendly proxy defaults for tiny JSON responses.
    proxy_buffering off;
    proxy_request_buffering off;
    tcp_nodelay on;
    tcp_nopush off;

    upstream backend {
        server api-1:8080;
        server api-2:8080;
        keepalive 256;
        keepalive_requests 10000;
    }

    server {
        listen 9999;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
