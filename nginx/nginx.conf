worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    proxy_buffering off;
    proxy_request_buffering off;
    tcp_nodelay on;
    tcp_nopush off;

    # Upstream APIs via Unix Domain Sockets (shared volume between containers).
    # Same bridge network for inter-container DNS; socket files live on the
    # shared `sockets` named volume mounted at /sock in all containers.
    upstream backend {
        server unix:/sock/api-1.sock;
        server unix:/sock/api-2.sock;
        keepalive 256;
        keepalive_requests 10000;
    }

    server {
        listen 9999;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
